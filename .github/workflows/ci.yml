# Build, lint and static analysis. The GPU tests (ctest, smoke) cannot run here: they need a
# Vulkan device and the Khronos validation layer; they are run on the maintainer's machine
# before every release (see docs/PUBLISHING.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and analyse
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc libvulkan-dev glslang-tools spirv-tools shellcheck

      - name: Configure and build (warnings are errors)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: ShellCheck
        run: shellcheck -x -s bash tests/smoke.sh packaging/install.sh packaging/release-key.sh

      - name: GCC static analyser
        run: |
          for f in src/*.c; do
            cc -fanalyzer -std=gnu11 -D_POSIX_C_SOURCE=200809L -Isrc -Ibuild/shaders \
               -Wall -Wextra -Werror -c "$f" -o /dev/null
          done

      - name: Package versions agree with CMake
        run: packaging/check-versions.sh

      - name: Upload the built layer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layer-${{ github.sha }}
          path: |
            build/layer/libafmf-linux.so
            build/layer/afmf-linux.json
          retention-days: 7

  packages:
    name: package (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rpm-fedora-44
            image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # fedora:44
            kind: rpm
          - name: deb-debian-trixie
            image: debian@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1 # debian:trixie
            kind: deb
          - name: deb-ubuntu-24.04
            image: ubuntu@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254 # ubuntu:24.04
            kind: deb
          - name: arch
            image: archlinux@sha256:70d777aaeb45befc04150df137c4d7c1b5042be442b4c904c38c6f6880bb7844 # archlinux:base-devel
            kind: arch
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the package
        run: packaging/build-package.sh ${{ matrix.kind }}

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.name }}-${{ github.sha }}
          path: packaging/out/*
          retention-days: 7
